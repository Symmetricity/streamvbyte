name: Draft vcpkg port

on:
  push:
    branches:
      - test/vcpkg-port-action
  workflow_dispatch:
    inputs:
      run_install:
        description: Run vcpkg install
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: package

      - name: Check vcpkg push token
        env:
          VCPKG_PR_TOKEN: ${{ secrets.VCPKG_PR_TOKEN }}
        run: |
          if [ -z "$VCPKG_PR_TOKEN" ]; then
            echo "::error::VCPKG_PR_TOKEN is required to push the generated branch to Symmetricity/vcpkg"
            exit 1
          fi

      - name: Checkout vcpkg
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Symmetricity/vcpkg
          fetch-depth: 0
          path: vcpkg
          token: ${{ secrets.VCPKG_PR_TOKEN }}

      - name: Resolve upstream tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/fast-pack/streamvbyte/releases/latest --jq .tag_name)"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            tag="$(gh api repos/fast-pack/streamvbyte/tags --jq '.[0].name')"
          fi
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::Could not resolve latest upstream tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare vcpkg branch
        id: branch
        env:
          PORT: streamvbyte
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git -C vcpkg remote add upstream https://github.com/microsoft/vcpkg.git || git -C vcpkg remote set-url upstream https://github.com/microsoft/vcpkg.git
          git -C vcpkg fetch upstream master --depth=1
          branch="test/update-${PORT}-${TAG}-${GITHUB_RUN_ID}"
          git -C vcpkg switch -C "$branch" upstream/master
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Draft port
        id: update
        uses: Symmetricity/update-vcpkg-port-action@v2
        with:
          port: streamvbyte
          upstream-repository: fast-pack/streamvbyte
          tag: ${{ steps.release.outputs.tag }}
          version-strip-prefix: v
          archive-url: https://github.com/{repository}/archive/refs/tags/{tag}.tar.gz
          head-ref: master
          vcpkg-root: vcpkg
          template-dir: package/.vcpkg-port-template
          cmake-config: "true"
          cmake-header-names: streamvbyte.h
          cmake-library-names: streamvbyte
          consumer-test: "true"
          consumer-test-language: C
          overwrite-version: "true"
          bootstrap: "true"
          run-install: ${{ github.event.inputs.run_install || 'true' }}
          test-triplet: x64-linux
          install-args: --clean-after-build --binarysource=clear
          x-add-version-args: ""
          dry-run: "false"

      - name: Print generated diff
        env:
          PORT_PATH: ${{ steps.update.outputs.port-relative-path }}
          VERSION_PATH: ${{ steps.update.outputs.version-relative-path }}
        run: |
          git -C vcpkg add -N "$PORT_PATH" "$VERSION_PATH"
          git -C vcpkg --no-pager diff -- "$PORT_PATH" versions/baseline.json "$VERSION_PATH"

      - name: Commit and push vcpkg branch
        if: ${{ steps.update.outputs.changed == 'true' }}
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          PORT: streamvbyte
          VERSION: ${{ steps.update.outputs.version }}
          PORT_PATH: ${{ steps.update.outputs.port-relative-path }}
          VERSION_PATH: ${{ steps.update.outputs.version-relative-path }}
        run: |
          git -C vcpkg config user.name "github-actions[bot]"
          git -C vcpkg config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C vcpkg add "$PORT_PATH" versions/baseline.json "$VERSION_PATH"
          git -C vcpkg commit \
            -m "[${PORT}] Add ${VERSION}" \
            -m "Generated by update-vcpkg-port-action from ${GITHUB_REPOSITORY}." \
            -m "Co-authored-by: Codex <noreply@openai.com>"
          git -C vcpkg push origin "HEAD:${BRANCH_NAME}"
          echo "Pushed https://github.com/Symmetricity/vcpkg/tree/${BRANCH_NAME}"
